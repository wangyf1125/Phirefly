{% set version = "0.2.1" %}
package:
  name: phirefly
  version: {{ version }}

# Build from an unpacked, checksum-recorded sdist, not a live research checkout.
source:
  path: {{ environ["PHIREFLY_SOURCE_DIR"] }}

build:
  number: 0
  noarch: python
  script: |
    "$PYTHON" -m pip install . --no-deps --no-build-isolation --no-index -vv
    mkdir -p "$PREFIX/share/phirefly/examples"
    cp -R examples/mhc_smoke "$PREFIX/share/phirefly/examples/"
  entry_points:
    - phirefly = phirefly.cli:main
    - phirefly-run = phirefly.pipeline:main
    - phirefly-extract = phirefly.extract.cli:main
    - phirefly-msf = phirefly.msf:main
    - phirefly-vcf = phirefly.vcf:main
    - phirefly-phaselet-qaia = phirefly.phaselet.cli:main
    - phirefly-hic-edges = phirefly.hic.component_edges:main
    - phirefly-hic-orient = phirefly.hic.orient:main
    - phirefly-hic-apply = phirefly.hic.apply:main
    - phirefly-hic-qc = phirefly.hic.qc:main

requirements:
  host:
    - python 3.11.*
    - pip
    - setuptools >=77
    - wheel
    - packaging >=24.2
  run:
    - python >=3.10,<3.12
    - numpy >=1.23,<2
    - scipy
    - pysam
    - htslib
    - mindquantum >=0.12,<0.13
    - whatshap ==2.8

test:
  requires:
    - pytest
    - whatshap ==2.8
  source_files:
    - tests
    - examples/mhc_smoke
  commands:
    - phirefly --version
    - python -m pytest -q tests
    - PHIREFLY_BENCHMARK=1 bash "$PREFIX/share/phirefly/examples/mhc_smoke/run_mhc_smoke.sh" smoke-output

about:
  home: https://github.com/wangyf1125/Phirefly
  license: MIT
  license_file: LICENSE
  summary: Hierarchical haplotype phasing from long reads and Hi-C

extra:
  recipe-maintainers:
    - wangyf1125
