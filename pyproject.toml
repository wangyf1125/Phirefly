[build-system]
requires = ["setuptools>=77", "wheel", "packaging>=24.2"]
build-backend = "setuptools.build_meta"

[project]
name = "phirefly"
version = "0.2.0"
description = "Hierarchical haplotype phasing from long reads and Hi-C"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = "MIT"
dependencies = [
  "numpy>=1.23,<2",
  "scipy",
  "pysam",
]

[project.optional-dependencies]
qaia = ["mindquantum>=0.12,<0.13"]
gpu = ["mindquantum>=0.12,<0.13", "torch"]
plot = ["matplotlib"]
benchmark = ["whatshap==2.8"]
test = ["pytest", "whatshap==2.8"]
all = ["mindquantum>=0.12,<0.13", "torch", "matplotlib", "whatshap==2.8"]

[project.urls]
Homepage = "https://github.com/wangyf1125/Phirefly"
Issues = "https://github.com/wangyf1125/Phirefly/issues"

[project.scripts]
phirefly = "phirefly.cli:main"
phirefly-run = "phirefly.pipeline:main"
phirefly-extract = "phirefly.extract.cli:main"
phirefly-msf = "phirefly.msf:main"
phirefly-vcf = "phirefly.vcf:main"
phirefly-phaselet-qaia = "phirefly.phaselet.cli:main"
phirefly-hic-edges = "phirefly.hic.component_edges:main"
phirefly-hic-orient = "phirefly.hic.orient:main"
phirefly-hic-apply = "phirefly.hic.apply:main"
phirefly-hic-qc = "phirefly.hic.qc:main"

[tool.setuptools.packages.find]
include = ["phirefly*"]
exclude = ["cli*", "examples*", "docs*"]

[tool.pytest.ini_options]
markers = ["qaia: integration test requiring MindQuantum and htslib commands"]
